generator:
  name: inherited-root-generator
  version: "0.1.0"
  architecture_version: "2026-09-18.semantic-architecture.v1"
  parameter_profile: "default-1600"
  status_policy: "experimental-candidate"

inventory:
  default_target: 1600
  minimum: 1200
  maximum: 2000

phonology:
  vowels: [a, e, i, u]
  consonants: [p, t, k, m, n, s, h, w, j, r]
  orthography:
    w: v
    j: y
  root_shapes:
    C: 0.15
    VC: 0.25
    CVC: 0.60
  root_final_exclude:
    VC: [h, j]
    CVC: [h, j]
  phoneme_weights:
    a: 1.0
    e: 1.0
    i: 1.0
    u: 1.0
    p: 1.0
    t: 1.0
    k: 1.0
    m: 1.0
    n: 1.0
    s: 1.0
    h: 0.8
    w: 0.9
    j: 0.9
    r: 1.0

semantic_pressure:
  semantic_centrality: 0.35
  network_connectivity: 0.25
  communicative_frequency: 0.20
  cultural_salience: 0.10
  grammatical_utility: 0.10
  domain_share:
    minimum_soft: 0.03
    maximum_soft: 0.18
    underweight_factor: 2.0
    overweight_factor: 0.15

family_model:
  event_process_centered: true
  simple_root_baseline: 0.55
  family_size_buckets:
    - {centrality_max: 0.50, share: 0.50, simple_probability: 0.70, size_min: 1, size_max: 3}
    - {centrality_max: 0.90, share: 0.40, simple_probability: 0.45, size_min: 2, size_max: 4}
    - {centrality_max: 0.98, share: 0.08, simple_probability: 0.20, size_min: 3, size_max: 6}
    - {centrality_max: 1.00, share: 0.02, simple_probability: 0.05, size_min: 5, size_max: 12}
  semantic_role_angles:
    - event
    - participant
    - product
    - instrument
    - location
    - result
    - state
    - social_role
    - quality
    - material
    - abstract
  family_stage_weights:
    initial: 0.55
    specialized: 0.25
    reinterpreted: 0.12
    opaque: 0.08

lexicalization_priors:
  "very_close": {polysemy: 0.45, derivation_conversion: 0.40, independent_root: 0.10, compound_other: 0.05}
  "close": {polysemy: 0.30, derivation_conversion: 0.35, independent_root: 0.25, compound_other: 0.10}
  "moderate": {polysemy: 0.20, derivation_conversion: 0.25, independent_root: 0.40, compound_other: 0.15}
  "distant": {polysemy: 0.10, derivation_conversion: 0.10, independent_root: 0.65, compound_other: 0.15}
  "very_distant": {polysemy: 0.03, derivation_conversion: 0.02, independent_root: 0.80, compound_other: 0.15}

historical_layering:
  broadly_transparent: 0.70
  specialized_reinterpreted: 0.20
  substantially_opaque: 0.10

category_behavior:
  neutral: 0.88
  noun_leaning: 0.05
  verb_leaning: 0.05
  stative_leaning: 0.02

probe_policy:
  neutral: 0.72
  diagnostic: 0.20
  specialized: 0.08
  diagnostic_features: [endpoint_fixed, strongly_directional, highly_resultative]
  specialized_features: [culturally_specific, narrow_artifact, ritual_or_social]
  never_force_generic: true

sound_symbolism:
  maximum_effect_on_rank: 0.08
  tendencies:
    animate:
      preferred_consonant_manners: [nasal, approximant, liquid]
      preferred_vowels: [a, e]
    liquid_substance:
      preferred_consonant_manners: [nasal, approximant, fricative]
      preferred_vowels: [u, a]
    impact_manipulation:
      preferred_consonant_manners: [stop]
      preferred_vowels: [a, u]
    continuity_change:
      preferred_consonant_manners: [fricative, liquid, nasal]
      preferred_vowels: [e, i]
    size_strength:
      preferred_consonant_manners: [stop, fricative]
      preferred_vowels: [a, u]
  deterministic_mapping_forbidden: true

validation:
  require_grammar_reconciliation: true
  reject_existing_lexicon_collisions: true
  reject_within_run_collisions: true
  require_seed: true
  allowed_candidate_status: experimental
  grammar_anchors:
    vowels: "a e i u"
    consonants: "p t k m n s h w j r"
    root_shapes: "C 15% / VC 25% / CVC 60%"
    final_exclusion_phrase: "exclude `h` and `j` from root-final position"

output:
  json_description: "Full machine-readable candidate records with generation provenance."
  tsv_description: "Human-auditable candidate table."
  json_fields:
    - root_id
    - root_form
    - root_shape
    - phonological_features
    - semantic_center
    - semantic_domain
    - semantic_subdomain
    - semantic_neighbors
    - semantic_relations
    - semantic_distance
    - conceptual_salience
    - expected_frequency
    - lexicalization_bias
    - family_affinity
    - derivational_affinity
    - sound_symbolic_profile
    - probe_role
    - family_id
    - family_stage
    - lexicalization_status
    - category_behavior
    - generation_seed
    - generation_version

