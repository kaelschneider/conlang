name: Generate root candidates

on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of candidate roots to generate (1200-5000)"
        required: true
        default: "4000"
        type: string
      seed:
        description: "Deterministic generator seed"
        required: true
        default: "424242"
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out developmental generator state
        uses: actions/checkout@v4
        with:
          ref: developmental
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Generate root candidates
        run: |
          python tools/generate_roots.py --seed "${{ inputs.seed }}" --count "${{ inputs.count }}" --output-json root-candidates.json --output-tsv root-candidates.tsv
      - name: Upload generated candidates
        uses: actions/upload-artifact@v4
        with:
          name: root-candidates-${{ inputs.count }}-${{ inputs.seed }}
          path: |
            root-candidates.json
            root-candidates.tsv
